<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Code Generator</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section class="card"><nav class="tabs"><button class="tab active" data-page="item" type="button">Item</button><button class="tab" data-page="dz" type="button">DZ</button><button class="tab" data-page="location" type="button">Location</button></nav>
<section id="item" class="page active"><h1>Item</h1><form id="itemForm" autocomplete="off"><label for="itemCode">Code 128</label><input id="itemCode" type="text" placeholder="Enter code" autocapitalize="characters" spellcheck="false"><button class="generate" type="submit">Generate</button></form><div id="itemResult" class="result" hidden><div class="code-value" id="itemValue"></div><div class="code-wrap"><canvas id="itemCanvas"></canvas></div></div><p id="itemError" class="error" hidden></p><div class="separator"></div><form id="tsForm" autocomplete="off"><label for="ts">ts</label><input id="ts" type="text" inputmode="numeric" maxlength="3" placeholder="Enter 3 digits"><button class="generate" type="submit">Generate</button></form><div id="tsResult" class="result" hidden><div class="code-value" id="tsValue"></div><div class="code-wrap"><canvas id="tsCanvas"></canvas></div></div><p id="tsError" class="error" hidden></p></section>
<section id="dz" class="page"><h1>DZ</h1><div class="dz-options"><button class="dz-option" data-dz="B" type="button">B</button><button class="dz-option" data-dz="C" type="button">C</button></div><div id="dzResult" class="result" hidden><div class="code-value" id="dzValue"></div><div class="code-wrap"><canvas id="dzCanvas"></canvas></div></div><p id="dzError" class="error" hidden></p></section>
<section id="location" class="page"><h1>Location</h1><form id="locationForm" autocomplete="off"><label for="prefix">1.</label><select id="prefix"><option value="P-0-B">P-0-B</option><option value="P-0-C">P-0-C</option></select><label for="number1">2.</label><input id="number1" type="text" inputmode="numeric" placeholder="For example, 230"><label for="letter">3.</label><input id="letter" type="text" inputmode="latin" maxlength="1" placeholder="For example, C" autocapitalize="characters"><label for="number2">4.</label><input id="number2" type="text" inputmode="numeric" placeholder="For example, 271"><button class="generate" type="submit">Generate</button></form><div id="locationResult" class="result" hidden><div class="code-value" id="locationValue"></div><div class="code-wrap"><canvas id="locationCanvas"></canvas></div></div><p id="locationError" class="error" hidden></p></section>
</section></main><script src="https://cdn.jsdelivr.net/npm/bwip-js@4.10.2/dist/bwip-js-min.js"></script><script src="script.js"></script></body></html>
